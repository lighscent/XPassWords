<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>XPassWords</title>
    <link rel="stylesheet" href="popup.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="dark-mode">
    <div class="app-wrapper">
      <header class="app-header">
        <div class="brand-group">
          <div class="brand">
            <h1>XPassWords</h1>
            <span id="app-version" class="version-badge">v1.0</span>
          </div>
        </div>
        <div class="header-controls">
          <button id="theme-toggle" class="btn-text">Light Mode</button>
        </div>
      </header>

      <main class="card">
        <div class="settings-col">
          <h2 class="section-title">CONFIGURATION</h2>

          <div class="control-row">
            <label class="control-label">Length</label>
            <div class="slider-wrapper">
              <input
                type="range"
                id="length-range"
                min="4"
                max="32"
                value="16"
              />
              <input
                type="number"
                id="length-num"
                value="16"
                min="4"
                max="32"
              />
            </div>
          </div>

          <div class="options-grid">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="uppercase" checked />
              <span class="custom-check"></span>
              <span>Uppercase</span>
            </label>
            <label class="checkbox-wrapper">
              <input type="checkbox" id="numbers" checked />
              <span class="custom-check"></span>
              <span>Numbers</span>
            </label>
            <label class="checkbox-wrapper">
              <input type="checkbox" id="symbols" checked />
              <span class="custom-check"></span>
              <span>Symbols</span>
            </label>
            <label class="checkbox-wrapper">
              <input type="checkbox" id="exclude-ambiguous" />
              <span class="custom-check"></span>
              <span>No Ambiguous</span>
            </label>
            <label class="checkbox-wrapper">
              <input type="checkbox" id="no-start-symbol" />
              <span class="custom-check"></span>
              <span>No Start Symbol</span>
            </label>
          </div>
        </div>

        <section class="output-col">
          <div class="password-container">
            <label class="section-label">GENERATED PASSWORD</label>
            <div id="password-display" class="password-content"></div>
            <button id="btn-copy" class="btn-icon" title="Copy">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path
                  d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                ></path>
              </svg>
            </button>
          </div>

          <div id="entropy-display" class="entropy-badge">Entropy: 0 bits</div>

          <button id="generate-btn" class="btn-primary btn-large">
            GENERATE
          </button>

          <a
            href="https://xpasswords.0x2.fun/"
            target="_blank"
            class="btn-secondary btn-large"
          >
            Open Web Version
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              style="margin-left: 5px; vertical-align: text-bottom"
            >
              <path
                d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
              ></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </section>
      </main>

      <div class="footer-links">
        <a
          href="https://github.com/lighscent/XPassWordsWeb"
          target="_blank"
          class="footer-link"
          >GitHub</a
        >
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
